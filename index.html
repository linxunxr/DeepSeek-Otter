<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Otter</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --fg: #e6e8ee;
        --muted: #8a93a6;
        --accent: #4d6bfe;
        --ok: #2ea44f;
        --warn: #d29922;
        --err: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 14px;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        user-select: none;
      }
      .logo {
        font-size: 40px;
        line-height: 1;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .status {
        color: var(--muted);
        min-height: 20px;
      }
      .status .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: 1px;
        background: var(--muted);
      }
      .status[data-state="starting"] .dot,
      .status[data-state="installing"] .dot {
        background: var(--warn);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .status[data-state="running"] .dot {
        background: var(--ok);
      }
      .status[data-state="failed"] .dot {
        background: var(--err);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .actions {
        display: flex;
        gap: 10px;
        visibility: hidden;
      }
      .actions[data-visible="true"] {
        visibility: visible;
      }
      button {
        background: var(--accent);
        border: none;
        color: #fff;
        padding: 7px 18px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      .log {
        width: min(560px, 80vw);
        height: 180px;
        overflow: auto;
        background: #161a22;
        border: 1px solid #232936;
        border-radius: 8px;
        padding: 10px 12px;
        font-family: Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
        user-select: text;
      }
      .log:empty {
        display: none;
      }
      /* 更新说明：notes 来自 CHANGELOG（CI 提取），按 h3/列表/加粗/行内码渲染 */
      .update-notes {
        max-width: min(560px, 80vw);
        max-height: 240px;
        overflow-y: auto;
        text-align: left;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        user-select: text;
        background: #161a22;
        border: 1px solid #232936;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .update-notes h3 {
        margin: 8px 0 4px;
        font-size: 13px;
        color: var(--fg);
      }
      .update-notes h3:first-child {
        margin-top: 0;
      }
      .update-notes ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      .update-notes li {
        margin: 3px 0;
      }
      .update-notes code {
        font-family: Consolas, monospace;
        background: #232936;
        border-radius: 3px;
        padding: 1px 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="logo">🦦</div>
      <div class="title">DeepSeek Otter</div>
      <div class="status" id="status" data-state="starting">
        <span class="dot"></span><span id="status-text">正在启动 dsh 后端…</span>
      </div>
      <button id="open-control" title="更新、版本与诊断" style="background: transparent; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 8px; text-decoration: underline dotted">打开控制中心（Ctrl+Alt+O）</button>
      <div class="actions" id="actions" data-visible="false">
        <button id="retry">重试</button>
        <button id="export-diag">导出诊断包</button>
      </div>
      <pre class="log" id="log"></pre>
      <div id="update-panel" style="display: none; flex-direction: column; align-items: center; gap: 8px">
        <span id="update-status-text" style="color: var(--muted)"></span>
        <div id="update-meta" style="display: none; font-size: 13px"></div>
        <div id="update-notes" class="update-notes" style="display: none"></div>
        <div style="width: min(360px, 60vw); height: 6px; background: #232936; border-radius: 3px; overflow: hidden">
          <div id="update-progress" style="display: none; height: 100%; width: 0%; background: var(--accent)"></div>
        </div>
        <div style="display: flex; gap: 10px">
          <button id="update-install" style="display: none">立即更新</button>
          <button id="update-close" style="background: #2a3040">关闭</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
