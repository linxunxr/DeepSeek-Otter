[package]
name = "deepseek-otter"
version = "0.1.0"
description = "DeepSeek Harness (dsh) 的轻量桌面发行版"
edition = "2021"

[lib]
name = "deepseek_otter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
# 薄壳追求体积小：牺牲一点编译时间换二进制优化
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
